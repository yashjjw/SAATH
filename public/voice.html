<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a2a">
<title>SAATH voice call</title>
<style>
  :root {
    --bg: #eef2f1; --card: #ffffff; --text: #111b21; --muted: #667781; --line: #0b141a1a;
    --head: #0f2a2a; --head-text: #e9f3f1; --accent: #1fa855; --blue: #027eb5;
    --out: #d9fdd3; --in: #ffffff; --shadow: #0b141a21; --warn-bg: #fff5c4; --warn: #54410d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b141a; --card: #182229; --text: #e9edef; --muted: #8696a0; --line: #ffffff1a;
      --head: #07181a; --head-text: #e9f3f1; --out: #005c4b; --in: #202c33;
      --shadow: #0000004d; --warn-bg: #182229; --warn: #ffd279; --blue: #53bdeb;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  body { font: 14.2px/1.4 "Segoe UI", Helvetica Neue, Helvetica, system-ui, sans-serif; color: var(--text); display: flex; flex-direction: column; max-width: 640px; margin: 0 auto; }
  button { font: inherit; cursor: pointer; }

  header { background: var(--head); color: var(--head-text); padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 12px; }
  .top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .top a, .top button { color: inherit; background: none; border: 1px solid #ffffff44; border-radius: 14px; padding: 4px 10px; font-size: 12px; text-decoration: none; }
  .top .title { flex: 1; font-weight: 600; font-size: 15px; min-width: 0; }
  .parties { display: flex; align-items: center; justify-content: space-around; gap: 6px; }
  .p { text-align: center; flex: 1; min-width: 0; }
  .p .av { width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 6px; display: grid; place-items: center; font-size: 24px; font-weight: 600; position: relative; color: #fff; }
  .p.saathi .av { background: #25d366; } .p.clinic .av { background: #3b82c4; }
  .p.speaking .av::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid currentColor; animation: pulse 1.1s ease-out infinite; }
  .p.saathi.speaking { color: #25d366; } .p.clinic.speaking { color: #7cc0ff; }
  @keyframes pulse { 0% { transform: scale(.9); opacity: .9; } 100% { transform: scale(1.25); opacity: 0; } }
  .p b { display: block; font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .p small { opacity: .7; font-size: 11.5px; }
  .mid { text-align: center; font-size: 12.5px; min-width: 96px; }
  .mid .time { font-size: 20px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .mid.ring .time::after { content: " …"; animation: bl 1s infinite; }
  @keyframes bl { 50% { opacity: .3; } }

  .banner { margin: 8px 12px 0; padding: 8px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--warn); font-size: 12.5px; display: none; }
  .banner.on { display: block; }

  #log { flex: 1; overflow-y: auto; padding: 12px 12px 8px; display: flex; flex-direction: column; gap: 8px; }
  .sys { align-self: center; background: var(--card); color: var(--muted); border-radius: 8px; padding: 5px 12px; font-size: 12.5px; box-shadow: 0 1px .5px var(--shadow); text-align: center; max-width: 92%; }
  .vm { max-width: 86%; background: var(--in); border-radius: 10px; padding: 8px 10px 8px; box-shadow: 0 1px .5px var(--shadow); }
  .vm.out { align-self: flex-end; background: var(--out); border-top-right-radius: 2px; }
  .vm.in { align-self: flex-start; border-top-left-radius: 2px; }
  .vm .who { font-size: 11.5px; font-weight: 600; margin-bottom: 4px; }
  .vm.out .who { color: var(--accent); } .vm.in .who { color: var(--blue); }
  .vp { display: flex; align-items: center; gap: 8px; min-width: 220px; }
  .vp button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; flex: none; }
  .vm.in .vp button { background: #3b82c4; }
  .wave { flex: 1; display: flex; align-items: center; gap: 2px; height: 28px; }
  .wave span { flex: 1; background: var(--muted); opacity: .5; border-radius: 2px; transform-origin: center; }
  .vm.live .wave span { animation: wv .8s ease-in-out infinite; opacity: .95; }
  @keyframes wv { 0%, 100% { transform: scaleY(.4); } 50% { transform: scaleY(1); } }
  .dur { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
  .tx { margin-top: 6px; font-size: 14px; }
  .tx.wait { color: var(--muted); font-style: italic; }
  .meta { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 4px; }
  .meta span { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 10px; padding: 1px 7px; }

  footer { padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; align-items: center; border-top: 1px solid var(--line); }
  #go { flex: 1; border: 0; border-radius: 22px; padding: 12px; background: var(--accent); color: #fff; font-weight: 600; font-size: 15px; }
  #go.end { background: #d64545; }
  .sel { display: flex; gap: 6px; font-size: 12px; color: var(--muted); align-items: center; flex-wrap: wrap; }
  .sel select { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; font: inherit; font-size: 12px; }
  .opts { padding: 6px 12px 0; }
</style>
</head>
<body>
<header>
  <div class="top">
    <a href="/">← Chat</a>
    <div class="title">Voice call simulation</div>
    <button id="pw" type="button">Password</button>
  </div>
  <div class="parties">
    <div class="p saathi" id="pS"><div class="av">S</div><b>Saathi</b><small>AI assistant</small></div>
    <div class="mid ring" id="mid"><div class="time" id="time">0:00</div><div id="status">Ready</div></div>
    <div class="p clinic" id="pC"><div class="av">🏥</div><b>Heartcare Clinic</b><small>Reception</small></div>
  </div>
</header>
<div class="banner" id="banner"></div>
<div class="opts"><div class="sel">
  <span>Voices:</span>
  <label>Saathi <select id="vS"></select></label>
  <label>Clinic <select id="vC"></select></label>
  <span id="engine"></span>
</div></div>
<div id="log" aria-live="polite"></div>
<footer><button id="go" type="button">▶ Start call</button></footer>

<script>
const $ = (id) => document.getElementById(id);
const log = $("log");
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const rnd = (a, b) => a + Math.random() * (b - a);
const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s) % 60).padStart(2, "0")}`;
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const scroll = () => { log.scrollTop = log.scrollHeight; };

// English (en-IN) voices from Gnani's Timbre v2.5 catalog.
const VOICES = ["Kaveri", "Trupti", "Devika", "Pranav", "Shlok", "Girish"];
const store = { get: (k, d) => { try { return localStorage.getItem(k) || d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
for (const [id, def] of [["vS", "Kaveri"], ["vC", "Pranav"]]) {
  const sel = $(id);
  sel.innerHTML = VOICES.map((v) => `<option>${v}</option>`).join("");
  sel.value = store.get("saath_" + id, def);
  sel.onchange = () => store.set("saath_" + id, sel.value);
}

const key = () => { try { return sessionStorage.getItem("saath_key") || ""; } catch { return ""; } };
function askKey() {
  const k = window.prompt("Test password (the CHAT_TEST_PASSWORD you set)", key());
  if (k !== null) { try { sessionStorage.setItem("saath_key", k); } catch {} }
  return key();
}
$("pw").onclick = askKey;

async function api(body) {
  const r = await fetch("/api/voice", { method: "POST", headers: { "content-type": "application/json", "x-test-key": key() }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || "HTTP " + r.status), { status: r.status });
  return j;
}

function banner(t) { const b = $("banner"); b.textContent = t; b.classList.toggle("on", !!t); }
function sys(t) { const d = document.createElement("div"); d.className = "sys"; d.textContent = t; log.appendChild(d); scroll(); }

let run = 0;            // bumped to cancel a running call
let engine = "gnani";   // "gnani" | "browser" (fallback, no STT)
let audioEl = null;
let timer = null, t0 = 0;

function setSpeaking(who) {
  $("pS").classList.toggle("speaking", who === "Saathi");
  $("pC").classList.toggle("speaking", who === "Clinic");
}
function stopAudio() { try { audioEl && audioEl.pause(); } catch {} audioEl = null; try { speechSynthesis.cancel(); } catch {} }

function b64ToUrl(b64, mime) {
  const bin = atob(b64); const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([u8], { type: mime }));
}

// Browser text-to-speech fallback, used only when Gnani isn't configured or errors.
function browserSpeak(text, who) {
  return new Promise((resolve) => {
    if (!("speechSynthesis" in window)) return resolve(0);
    const voices = speechSynthesis.getVoices();
    const v = voices.find((x) => /en[-_]IN/i.test(x.lang)) || voices.find((x) => /^en/i.test(x.lang));
    const u = new SpeechSynthesisUtterance(text);
    if (v) u.voice = v; u.pitch = who === "Saathi" ? 1.15 : 0.8; u.rate = 1.02;
    const t = Date.now(); let done = false;
    const finish = () => { if (done) return; done = true; clearTimeout(guard); resolve((Date.now() - t) / 1000); };
    const guard = setTimeout(finish, 3000 + text.length * 90);   // speechSynthesis can fail to fire onend
    u.onend = u.onerror = finish;
    speechSynthesis.speak(u);
  });
}

// Resolves when playback ends. A timer guards against audio that never reports "ended"
// (autoplay blocked, no output device), so one bad line can't freeze the whole call.
function playUrl(url) {
  return new Promise((resolve) => {
    const a = new Audio(url); audioEl = a;
    let done = false, guard = setTimeout(() => finish(0), 25000);
    const finish = (d) => { if (done) return; done = true; clearTimeout(guard); resolve(d || a.duration || 0); };
    a.onloadedmetadata = () => { clearTimeout(guard); guard = setTimeout(() => finish(a.duration), a.duration * 1000 + 1500); };
    a.onended = () => finish(a.duration);
    a.onerror = () => finish(0);
    a.play().catch(() => finish(0));
  });
}

function bubble(line, label) {
  const side = line.who === "Saathi" ? "out" : "in";
  const d = document.createElement("div"); d.className = `vm ${side}`;
  const bars = Array.from({ length: 30 }, (_, i) => `<span style="height:${25 + ((i * 41 + (side === "out" ? 7 : 19)) % 75)}%;animation-delay:${(i % 8) * 0.08}s"></span>`).join("");
  d.innerHTML = `<div class="who">${label}</div><div class="vp"><button type="button" aria-label="Play again">▶</button><div class="wave">${bars}</div><span class="dur">0:00</span></div><div class="tx wait">🎧 listening…</div><div class="meta"></div>`;
  log.appendChild(d); scroll();
  return d;
}
const chip = (d, t) => { const s = document.createElement("span"); s.textContent = t; d.querySelector(".meta").appendChild(s); };

async function speakLine(line, script) {
  if (engine !== "gnani") return { browser: true };
  const voice = $(line.who === "Saathi" ? "vS" : "vC").value;
  return api({ action: "speak", text: line.text, voice, language: "en-IN", transcribe: true });
}

async function startCall() {
  const me = ++run;
  const alive = () => me === run;
  $("go").textContent = "⏹ End call"; $("go").classList.add("end");
  log.innerHTML = ""; banner(""); stopAudio(); setSpeaking(null);
  $("mid").classList.add("ring"); $("time").textContent = "0:00"; $("status").textContent = "Calling…";
  if (!key() && !askKey()) return endCall(me, "No password set.");

  let script;
  try { script = await api({ action: "script" }); }
  catch (e) {
    if (e.status === 401) { try { sessionStorage.removeItem("saath_key"); } catch {} return endCall(me, "Wrong password. Tap Password to retry."); }
    if (e.status === 404) return endCall(me, "Voice tester is off: set CHAT_TEST_PASSWORD and redeploy.");
    return endCall(me, "Could not start: " + e.message);
  }
  engine = script.gnani ? "gnani" : "browser";
  $("engine").textContent = engine === "gnani" ? "Gnani Timbre v2.5 (TTS) + Prisma v2.5 (STT)" : "Browser voice (fallback)";
  if (engine === "browser") banner("GNANI_API_KEY isn't set on the server, so this uses your browser's voice and there is no speech-to-text: the transcripts below are the script, not STT output. Add the key to use Gnani.");

  sys(script.title);
  const cache = [];
  const prefetch = (i) => (cache[i] ??= i < script.lines.length ? speakLine(script.lines[i]) : null);
  prefetch(0);                                     // synthesize the first line while the phone "rings"
  await sleep(rnd(2400, 3800)); if (!alive()) return;

  $("mid").classList.remove("ring"); $("status").textContent = "Connected";
  t0 = Date.now(); clearInterval(timer);
  timer = setInterval(() => { $("time").textContent = mmss((Date.now() - t0) / 1000); }, 500);

  for (let i = 0; i < script.lines.length; i++) {
    const line = script.lines[i];
    let data;
    try { data = await prefetch(i); }
    catch (e) {
      if (e.status === 401) return endCall(me, "Wrong password.");
      banner(`${e.message}. Continuing with browser voice (no speech-to-text) for the rest of the call.`);
      engine = "browser"; cache[i] = null; data = { browser: true };
    }
    if (!alive()) return;
    prefetch(i + 1);                               // synthesize the next line while this one plays

    const label = line.who === "Saathi" ? "Saathi · AI assistant" : "Clinic reception";
    const d = bubble(line, label);
    setSpeaking(line.who); $("status").textContent = line.who === "Saathi" ? "Saathi speaking" : "Clinic speaking";
    d.classList.add("live");

    let dur = 0, url = null;
    if (data.browser) { dur = await browserSpeak(line.text, line.who); }
    else { url = b64ToUrl(data.audio, data.mime); dur = await playUrl(url); }
    if (!alive()) return;
    d.classList.remove("live"); setSpeaking(null);
    d.querySelector(".dur").textContent = mmss(dur);

    // reveal what speech-to-text heard
    const tx = d.querySelector(".tx"); tx.textContent = "Transcribing…";
    await sleep(rnd(250, 600)); if (!alive()) return;
    tx.className = "tx";
    if (data.browser) { tx.textContent = line.text; chip(d, "script text, no STT"); }
    else if (data.transcript) { tx.textContent = data.transcript; chip(d, `STT ${data.ms.stt} ms`); chip(d, `TTS ${data.ms.tts} ms`); }
    else { tx.textContent = line.text; chip(d, "STT failed: showing script"); chip(d, `TTS ${data.ms.tts} ms`); if (data.sttError) banner(data.sttError); }

    const btn = d.querySelector("button");
    btn.onclick = async () => {
      if (!url && !data.browser) return;
      stopAudio(); d.classList.add("live");
      if (data.browser) await browserSpeak(line.text, line.who); else await playUrl(url);
      d.classList.remove("live");
    };
    scroll();
    await sleep(rnd(350, 1100));                   // natural gap between turns
  }
  clearInterval(timer);
  $("status").textContent = "Call ended";
  sys("Call ended · " + mmss((Date.now() - t0) / 1000));
  finish();
}

function finish() { $("go").textContent = "↺ Call again"; $("go").classList.remove("end"); setSpeaking(null); }
function endCall(me, msg) { if (me !== run) return; clearInterval(timer); $("status").textContent = "Ready"; $("mid").classList.remove("ring"); if (msg) sys(msg); finish(); }

$("go").onclick = () => {
  if ($("go").classList.contains("end")) { run++; stopAudio(); clearInterval(timer); $("status").textContent = "Ended"; sys("Call ended by you."); finish(); }
  else startCall();
};
$("mid").classList.remove("ring");
sys("Press Start call to hear Saathi phone the clinic. Both sides are voiced with Gnani TTS; each line is then transcribed with Gnani STT.");
</script>
</body>
</html>
