<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a2a">
<title>SAATH voice call</title>
<style>
  :root {
    --bg: #eef2f1; --card: #ffffff; --text: #111b21; --muted: #667781; --line: #0b141a1a;
    --head: #0f2a2a; --head-text: #e9f3f1; --accent: #1fa855; --blue: #027eb5; --red: #d64545;
    --out: #d9fdd3; --in: #ffffff; --shadow: #0b141a21; --warn-bg: #fff5c4; --warn: #54410d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b141a; --card: #182229; --text: #e9edef; --muted: #8696a0; --line: #ffffff1a;
      --head: #07181a; --head-text: #e9f3f1; --out: #005c4b; --in: #202c33;
      --shadow: #0000004d; --warn-bg: #182229; --warn: #ffd279; --blue: #53bdeb;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  body { font: 14.2px/1.4 "Segoe UI", Helvetica Neue, Helvetica, system-ui, sans-serif; color: var(--text); display: flex; flex-direction: column; max-width: 640px; margin: 0 auto; }
  button { font: inherit; cursor: pointer; }

  header { background: var(--head); color: var(--head-text); padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 12px; }
  .top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .top a, .top button { color: inherit; background: none; border: 1px solid #ffffff44; border-radius: 14px; padding: 4px 10px; font-size: 12px; text-decoration: none; }
  .top .title { flex: 1; font-weight: 600; font-size: 15px; min-width: 0; }
  .parties { display: flex; align-items: center; justify-content: space-around; gap: 6px; }
  .p { text-align: center; flex: 1; min-width: 0; }
  .p .av { width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 6px; display: grid; place-items: center; font-size: 24px; font-weight: 600; position: relative; color: #fff; }
  .p.saathi .av { background: #25d366; } .p.clinic .av { background: #3b82c4; }
  .p.speaking .av::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid currentColor; animation: pulse 1.1s ease-out infinite; }
  .p.saathi.speaking { color: #25d366; } .p.clinic.speaking { color: #7cc0ff; }
  @keyframes pulse { 0% { transform: scale(.9); opacity: .9; } 100% { transform: scale(1.25); opacity: 0; } }
  .p b { display: block; font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .p small { opacity: .7; font-size: 11.5px; }
  .mid { text-align: center; font-size: 12.5px; min-width: 110px; }
  .mid .time { font-size: 20px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .mid.ring .time::after { content: " …"; animation: bl 1s infinite; }
  @keyframes bl { 50% { opacity: .3; } }

  .banner { margin: 8px 12px 0; padding: 8px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--warn); font-size: 12.5px; display: none; }
  .banner.on { display: block; }
  .opts { padding: 6px 12px 0; }
  .sel { display: flex; gap: 8px; font-size: 12px; color: var(--muted); align-items: center; flex-wrap: wrap; }
  .sel select { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; font: inherit; font-size: 12px; }

  #log { flex: 1; overflow-y: auto; padding: 12px 12px 8px; display: flex; flex-direction: column; gap: 8px; }
  .sys { align-self: center; background: var(--card); color: var(--muted); border-radius: 8px; padding: 5px 12px; font-size: 12.5px; box-shadow: 0 1px .5px var(--shadow); text-align: center; max-width: 92%; }
  .sys button { margin-left: 8px; border: 1px solid var(--line); background: none; color: var(--blue); border-radius: 10px; padding: 1px 10px; }
  .vm { max-width: 86%; background: var(--in); border-radius: 10px; padding: 8px 10px 8px; box-shadow: 0 1px .5px var(--shadow); }
  .vm.out { align-self: flex-end; background: var(--out); border-top-right-radius: 2px; }
  .vm.in { align-self: flex-start; border-top-left-radius: 2px; }
  .vm .who { font-size: 11.5px; font-weight: 600; margin-bottom: 4px; }
  .vm.out .who { color: var(--accent); } .vm.in .who { color: var(--blue); }
  .vp { display: flex; align-items: center; gap: 8px; min-width: 220px; }
  .vp button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; flex: none; }
  .vm.in .vp button { background: #3b82c4; }
  .wave { flex: 1; display: flex; align-items: center; gap: 2px; height: 28px; }
  .wave span { flex: 1; background: var(--muted); opacity: .5; border-radius: 2px; transform-origin: center; }
  .vm.live .wave span { animation: wv .8s ease-in-out infinite; opacity: .95; }
  @keyframes wv { 0%, 100% { transform: scaleY(.4); } 50% { transform: scaleY(1); } }
  .dur { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
  .tx { margin-top: 6px; font-size: 14px; }
  .tx.wait { color: var(--muted); font-style: italic; }
  .meta { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 4px; }
  .meta span { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 10px; padding: 1px 7px; }
  .typing { align-self: flex-end; background: var(--out); border-radius: 10px; padding: 10px 14px; display: flex; gap: 4px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); opacity: .5; animation: bl 1.1s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  .summary { align-self: center; width: 92%; background: var(--card); border-radius: 12px; padding: 12px 14px; box-shadow: 0 1px 2px var(--shadow); border-left: 4px solid var(--accent); }
  .summary.no { border-left-color: var(--red); }
  .summary h4 { margin: 0 0 6px; font-size: 14px; }
  .summary div { font-size: 13px; margin: 2px 0; }
  .summary div b { display: inline-block; min-width: 92px; color: var(--muted); font-weight: 500; }
  .summary small { color: var(--muted); display: block; margin-top: 6px; }

  .dock { padding: 8px 12px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 8px; align-items: center; }
  #go { flex: none; border: 0; border-radius: 22px; padding: 10px 16px; background: var(--accent); color: #fff; font-weight: 600; }
  #go.end { background: var(--red); }
  #mic { flex: 1; border: 0; border-radius: 22px; padding: 12px; background: var(--blue); color: #fff; font-weight: 600; font-size: 15px; }
  #mic:disabled, #typed:disabled, #send:disabled { opacity: .45; cursor: not-allowed; }
  #mic.rec { background: var(--red); }
  #mic .lvl { display: inline-block; width: 60px; height: 8px; border-radius: 4px; background: #ffffff55; vertical-align: middle; margin-left: 8px; overflow: hidden; }
  #mic .lvl i { display: block; height: 100%; width: 0; background: #fff; transition: width .08s; }
  #typed { flex: 1; border: 1px solid var(--line); border-radius: 20px; padding: 9px 14px; background: var(--card); color: var(--text); font: inherit; min-width: 0; }
  #send { border: 0; border-radius: 50%; width: 38px; height: 38px; background: var(--accent); color: #fff; flex: none; }
  .hint { font-size: 12px; color: var(--muted); text-align: center; min-height: 16px; }
</style>
</head>
<body>
<header>
  <div class="top">
    <a href="/">← Chat</a>
    <div class="title">Saathi · calling Heartcare Clinic</div>
    <button id="pw" type="button">Password</button>
  </div>
  <div class="parties">
    <div class="p saathi" id="pS"><div class="av">S</div><b>Saathi</b><small>AI assistant</small></div>
    <div class="mid" id="mid"><div class="time" id="time">0:00</div><div id="status">Ready</div></div>
    <div class="p clinic" id="pC"><div class="av">🏥</div><b>Heartcare Clinic</b><small>Reception</small></div>
  </div>
</header>
<div class="banner" id="banner"></div>
<div class="opts"><div class="sel">
  <label>Saathi's voice <select id="vS"></select></label>
  <span id="engine"></span>
</div></div>
<div id="log" aria-live="polite"></div>
<div class="dock">
  <div class="hint" id="hint"></div>
  <div class="row">
    <button id="go" type="button">▶ Start call</button>
    <button id="mic" type="button" disabled>🎙 Tap to speak</button>
  </div>
  <div class="row">
    <input id="typed" placeholder="or type a reply" autocomplete="off" disabled>
    <button id="send" type="button" aria-label="Send" disabled>➤</button>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const log = $("log");
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const rnd = (a, b) => a + Math.random() * (b - a);
const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s) % 60).padStart(2, "0")}`;
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const scroll = () => { log.scrollTop = log.scrollHeight; };

// English (en-IN) voices from Gnani's Timbre v2.5 catalog.
const VOICES = ["Kaveri", "Trupti", "Devika", "Pranav", "Shlok", "Girish"];
const store = { get: (k, d) => { try { return localStorage.getItem(k) || d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
$("vS").innerHTML = VOICES.map((v) => `<option>${v}</option>`).join("");
$("vS").value = store.get("saath_vS", "Kaveri");
$("vS").onchange = () => store.set("saath_vS", $("vS").value);

const key = () => { try { return sessionStorage.getItem("saath_key") || ""; } catch { return ""; } };
function askKey() {
  const k = window.prompt("Test password (the CHAT_TEST_PASSWORD you set)", key());
  if (k !== null) { try { sessionStorage.setItem("saath_key", k); } catch {} }
  return key();
}
$("pw").onclick = askKey;

async function api(body) {
  const r = await fetch("/api/voice", { method: "POST", headers: { "content-type": "application/json", "x-test-key": key() }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || "HTTP " + r.status), { status: r.status });
  return j;
}

function banner(t) { const b = $("banner"); b.textContent = t; b.classList.toggle("on", !!t); }
function sys(t, retry) {
  const d = document.createElement("div"); d.className = "sys"; d.textContent = t;
  if (retry) { const b = document.createElement("button"); b.type = "button"; b.textContent = "Retry"; b.onclick = () => { d.remove(); retry(); }; d.appendChild(b); }
  log.appendChild(d); scroll();
}
const hint = (t) => { $("hint").textContent = t || ""; };

// ---- call state ----------------------------------------------------------------------------
let run = 0;             // bumped to cancel the call
let engine = "gnani";    // "gnani" | "browser" (fallback: browser voice for Saathi, typed input only)
let lines = [], idx = 0, cache = {};   // the script, the current position, prefetched Saathi audio
let audioEl = null, timer = null, t0 = 0;

function setSpeaking(who) {
  $("pS").classList.toggle("speaking", who === "Saathi");
  $("pC").classList.toggle("speaking", who === "Clinic");
}
function stopAudio() { try { audioEl && audioEl.pause(); } catch {} audioEl = null; try { speechSynthesis.cancel(); } catch {} }
function b64ToUrl(b64, mime) {
  const bin = atob(b64); const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([u8], { type: mime }));
}

function browserSpeak(text) {
  return new Promise((resolve) => {
    if (!("speechSynthesis" in window)) return resolve(0);
    const voices = speechSynthesis.getVoices();
    const v = voices.find((x) => /en[-_]IN/i.test(x.lang)) || voices.find((x) => /^en/i.test(x.lang));
    const u = new SpeechSynthesisUtterance(text); if (v) u.voice = v; u.pitch = 1.15; u.rate = 1.02;
    const t = Date.now(); let done = false;
    const finish = () => { if (done) return; done = true; clearTimeout(guard); resolve((Date.now() - t) / 1000); };
    const guard = setTimeout(finish, 3000 + text.length * 90);
    u.onend = u.onerror = finish; speechSynthesis.speak(u);
  });
}
// Resolves when playback ends; a timer guards against audio that never reports "ended".
function playUrl(url) {
  return new Promise((resolve) => {
    const a = new Audio(url); audioEl = a;
    let done = false, guard = setTimeout(() => finish(0), 30000);
    const finish = (d) => { if (done) return; done = true; clearTimeout(guard); resolve(d || (isFinite(a.duration) ? a.duration : 0)); };
    a.onloadedmetadata = () => { if (!isFinite(a.duration)) return; clearTimeout(guard); guard = setTimeout(() => finish(a.duration), a.duration * 1000 + 1500); };
    a.onended = () => finish(a.duration); a.onerror = () => finish(0);
    a.play().catch(() => finish(0));
  });
}

function bubble(who, label) {
  const d = document.createElement("div"); d.className = `vm ${who === "Saathi" ? "out" : "in"}`;
  const side = who === "Saathi" ? 7 : 19;
  const bars = Array.from({ length: 30 }, (_, i) => `<span style="height:${25 + ((i * 41 + side) % 75)}%;animation-delay:${(i % 8) * 0.08}s"></span>`).join("");
  d.innerHTML = `<div class="who">${label}</div><div class="vp"><button type="button" aria-label="Play">▶</button><div class="wave">${bars}</div><span class="dur">0:00</span></div><div class="tx wait"></div><div class="meta"></div>`;
  log.appendChild(d); scroll(); return d;
}
const chip = (d, t) => { const s = document.createElement("span"); s.textContent = t; d.querySelector(".meta").appendChild(s); };
function typingDots() { const d = document.createElement("div"); d.className = "typing"; d.innerHTML = "<i></i><i></i><i></i>"; log.appendChild(d); scroll(); return d; }

function setTurnUi(enabled) {
  const micOk = enabled && engine === "gnani" && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  $("mic").disabled = !micOk; $("typed").disabled = !enabled; $("send").disabled = !enabled;
  if (enabled) { hint(micOk ? "Tap the mic to reply." : "Type a reply."); $("typed").focus(); }
  else hint("");
}

// ---- Saathi speaks -------------------------------------------------------------------------
async function saathiSay(text, me, meta = {}, pre = null) {
  const alive = () => me === run;
  const d = bubble("Saathi", "Saathi · AI assistant");
  d.querySelector(".tx").textContent = "🎧 speaking…";
  setSpeaking("Saathi"); $("status").textContent = "Saathi speaking";
  let data;
  try {
    data = engine === "gnani" ? await (pre || api({ action: "speak", text, voice: $("vS").value, language: "en-IN", transcribe: false })) : { browser: true };
  } catch (e) {
    if (e.status === 401) { d.remove(); return endCall(me, "Wrong password."); }
    banner(`${e.message}. Saathi continues in your browser's voice; speech-to-text is unavailable, so type what the clinic says.`);
    engine = "browser"; data = { browser: true };
  }
  if (!alive()) return;
  d.classList.add("live");
  let dur = 0, url = null;
  if (data.browser) dur = await browserSpeak(text);
  else { url = b64ToUrl(data.audio, data.mime); dur = await playUrl(url); }
  if (!alive()) return;
  d.classList.remove("live"); setSpeaking(null);
  d.querySelector(".dur").textContent = mmss(dur);
  const tx = d.querySelector(".tx"); tx.className = "tx"; tx.textContent = text;
  if (meta.llm) chip(d, `reply ${(meta.llm / 1000).toFixed(1)} s`);
  if (data.ms) chip(d, `TTS ${data.ms.tts} ms`); else chip(d, "browser voice");
  d.querySelector("button").onclick = async () => {
    stopAudio(); d.classList.add("live");
    if (url) await playUrl(url); else await browserSpeak(text);
    d.classList.remove("live");
  };
  scroll();
}

// ---- the clinic (you) speaks ----------------------------------------------------------------
function addClinicBubble(text, audioUrl, chips) {
  const d = bubble("Clinic", "Heartcare Clinic · reception");
  const tx = d.querySelector(".tx"); tx.className = "tx"; tx.textContent = text;
  chips.forEach((c) => chip(d, c));
  const btn = d.querySelector("button");
  if (audioUrl) {
    const a = new Audio(audioUrl);
    a.onloadedmetadata = () => { if (isFinite(a.duration)) d.querySelector(".dur").textContent = mmss(a.duration); };
    btn.onclick = async () => { stopAudio(); d.classList.add("live"); await playUrl(audioUrl); d.classList.remove("live"); };
  } else { btn.disabled = true; btn.style.opacity = ".35"; d.querySelector(".wave").style.opacity = ".3"; }
  scroll();
}

// ---- scripted flow ----------------------------------------------------------------------------
function prefetch(i) {                       // synthesize a Saathi line ahead of time so it plays without a gap
  if (engine !== "gnani" || !lines[i] || lines[i].who !== "Saathi") return null;
  return (cache[i] ??= api({ action: "speak", text: lines[i].text, voice: $("vS").value, language: "en-IN", transcribe: false }));
}
// Plays Saathi's lines until it is the clinic's (your) turn, or the script is over.
async function advance(me) {
  const alive = () => me === run;
  while (alive() && idx < lines.length) {
    const line = lines[idx];
    if (line.who === "Clinic") {
      prefetch(idx + 1);
      $("status").textContent = "Listening"; setTurnUi(true); return;
    }
    await sleep(rnd(350, 1100)); if (!alive()) return;       // a natural beat before Saathi speaks
    const pre = prefetch(idx); if (pre) pre.catch(() => {});
    idx++;
    await saathiSay(line.text, me, {}, pre); if (!alive()) return;
  }
  if (alive()) finishCall(me);
}
function submitClinic(me, text, url, chips) {
  const line = lines[idx];
  if (!line || line.who !== "Clinic" || me !== run) return;
  addClinicBubble(text, url, chips);
  setTurnUi(false); idx++;
  advance(me);
}

// ---- microphone ------------------------------------------------------------------------------
let rec = null, stream = null, chunks = [], meter = null, recTimer = null;

async function toWav16k(blob) {          // decode whatever the browser recorded, resample to 16 kHz mono WAV
  const buf = await blob.arrayBuffer();
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const decoded = await ac.decodeAudioData(buf.slice(0)); ac.close();
  const off = new OfflineAudioContext(1, Math.max(1, Math.ceil(decoded.duration * 16000)), 16000);
  const src = off.createBufferSource(); src.buffer = decoded; src.connect(off.destination); src.start();
  const pcm = (await off.startRendering()).getChannelData(0);
  const out = new DataView(new ArrayBuffer(44 + pcm.length * 2));
  const w = (o, s) => { for (let i = 0; i < s.length; i++) out.setUint8(o + i, s.charCodeAt(i)); };
  w(0, "RIFF"); out.setUint32(4, 36 + pcm.length * 2, true); w(8, "WAVE"); w(12, "fmt ");
  out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 1, true);
  out.setUint32(24, 16000, true); out.setUint32(28, 32000, true); out.setUint16(32, 2, true); out.setUint16(34, 16, true);
  w(36, "data"); out.setUint32(40, pcm.length * 2, true);
  for (let i = 0; i < pcm.length; i++) out.setInt16(44 + i * 2, Math.max(-1, Math.min(1, pcm[i])) * 0x7fff, true);
  return { bytes: new Uint8Array(out.buffer), seconds: decoded.duration };
}
function bytesToB64(u8) { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }

async function startRec() {
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { hint("Microphone blocked. Allow it in the browser, or type instead."); return; }
  chunks = []; rec = new MediaRecorder(stream);
  rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = onRecStop;
  rec.start();
  $("mic").classList.add("rec"); $("mic").innerHTML = '⏹ Tap to send <span class="lvl"><i></i></span>';
  setSpeaking("Clinic"); $("status").textContent = "You are speaking"; hint("Recording… tap again to send (auto-stops at 25 s).");
  const ac = new (window.AudioContext || window.webkitAudioContext)(); const an = ac.createAnalyser(); an.fftSize = 512;
  ac.createMediaStreamSource(stream).connect(an); const data = new Uint8Array(an.fftSize);
  meter = setInterval(() => { an.getByteTimeDomainData(data); let m = 0; for (const v of data) m = Math.max(m, Math.abs(v - 128)); const i = $("mic").querySelector(".lvl i"); if (i) i.style.width = Math.min(100, m * 1.6) + "%"; }, 80);
  rec._ac = ac;
  recTimer = setTimeout(stopRec, 25000);
}
function stopRec() {
  clearTimeout(recTimer); clearInterval(meter);
  if (rec && rec.state !== "inactive") rec.stop();
}
async function onRecStop() {
  const me = run; const mime = rec.mimeType || "audio/webm";
  stream.getTracks().forEach((t) => t.stop()); try { rec._ac.close(); } catch {}
  $("mic").classList.remove("rec"); $("mic").textContent = "🎙 Tap to speak"; setSpeaking(null);
  const blob = new Blob(chunks, { type: mime });
  if (me !== run) return;
  setTurnUi(false); $("status").textContent = "Transcribing…"; hint("Transcribing with Gnani STT…");
  try {
    const wav = await toWav16k(blob);
    if (wav.seconds < 0.4) { hint("That was too short. Tap the mic and try again."); $("status").textContent = "Listening"; setTurnUi(true); return; }
    const r = await api({ action: "stt", audio: bytesToB64(wav.bytes), mime: "audio/wav", language: "en-IN" });
    if (me !== run) return;
    if (!r.transcript) { hint("I couldn't hear any words. Tap the mic and try again."); $("status").textContent = "Listening"; setTurnUi(true); return; }
    hint(""); submitClinic(me, r.transcript, URL.createObjectURL(blob), [`STT ${r.ms.stt} ms`, "Gnani Prisma"]);
  } catch (e) {
    if (me !== run) return;
    if (e.status === 401) return endCall(me, "Wrong password.");
    sys("Couldn't transcribe that: " + e.message + " (you can type instead)"); $("status").textContent = "Listening"; setTurnUi(true);
  }
}
$("mic").onclick = () => { if (rec && rec.state === "recording") stopRec(); else if (!$("mic").disabled) startRec(); };

function sendTyped() {
  const t = $("typed").value.trim(); if (!t || $("typed").disabled) return;
  $("typed").value = "";
  submitClinic(run, t, null, ["typed"]);
}
$("send").onclick = sendTyped;
$("typed").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); sendTyped(); } });

// ---- call lifecycle --------------------------------------------------------------------------
async function startCall() {
  const me = ++run; const alive = () => me === run;
  $("go").textContent = "⏹ End call"; $("go").classList.add("end");
  log.innerHTML = ""; banner(""); stopAudio(); setSpeaking(null); setTurnUi(false); lines = []; idx = 0; cache = {};
  $("mid").classList.add("ring"); $("time").textContent = "0:00"; $("status").textContent = "Calling…";
  if (!key() && !askKey()) return endCall(me, "No password set.");
  let call;
  try { call = await api({ action: "script" }); }
  catch (e) {
    if (e.status === 401) { try { sessionStorage.removeItem("saath_key"); } catch {} return endCall(me, "Wrong password. Tap Password to retry."); }
    if (e.status === 404) return endCall(me, "Voice tester is off: set CHAT_TEST_PASSWORD and redeploy.");
    return endCall(me, "Could not start: " + e.message);
  }
  lines = call.lines;
  engine = call.gnani ? "gnani" : "browser";
  $("engine").textContent = engine === "gnani" ? "Gnani Timbre (TTS) + Prisma (STT)" : "Browser voice (fallback)";
  if (engine === "browser") banner("GNANI_API_KEY isn't set on the server: Saathi speaks in your browser's voice and there is no speech-to-text, so type your replies. Add the key to use Gnani.");
  sys(call.title);
  prefetch(0);                                            // synthesize Saathi's opening while the phone "rings"
  await sleep(rnd(2200, 3600)); if (!alive()) return;     // ringing
  $("mid").classList.remove("ring"); $("status").textContent = "Connected";
  t0 = Date.now(); clearInterval(timer);
  timer = setInterval(() => { $("time").textContent = mmss((Date.now() - t0) / 1000); }, 500);
  sys("Connected");
  await advance(me);
}

function finishCall(me) {
  clearInterval(timer); setTurnUi(false);
  $("status").textContent = "Call ended";
  sys("Call ended · " + mmss((Date.now() - t0) / 1000));
  setBtnAgain();
  const d = document.createElement("div"); d.className = "summary";
  d.innerHTML = `<h4>✅ Appointment confirmed</h4><div><b>Doctor</b>Dr. Meera Kulkarni</div><div><b>Date</b>6 Oct</div><div><b>Time</b>11:30 am</div><div><b>Fee</b>₹800</div><div><b>Bring</b>old reports</div>`;
  log.appendChild(d); scroll();
}
function setBtnAgain() { $("go").textContent = "↺ Call again"; $("go").classList.remove("end"); setSpeaking(null); }
function endCall(me, msg) { if (me !== run) return; clearInterval(timer); $("status").textContent = "Ready"; $("mid").classList.remove("ring"); setTurnUi(false); if (msg) sys(msg); setBtnAgain(); }

$("go").onclick = () => {
  if ($("go").classList.contains("end")) {
    run++; stopAudio(); clearInterval(timer); stopRec(); setTurnUi(false);
    $("status").textContent = "Ended"; sys("Call ended by you."); setBtnAgain();
  } else startCall();
};
sys("Press Start call to place the call.");
</script>
