<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Presenter notes</title>
<style>
  :root { --bg: #f5f3ee; --card: #fff; --text: #111b21; --muted: #667781; --line: #0b141a1a; --accent: #1fa855; --blue: #027eb5; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b141a; --card: #182229; --text: #e9edef; --muted: #8696a0; --line: #ffffff1a; --blue: #53bdeb; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 20px 16px 40px; max-width: 640px; margin-inline: auto; }
  h1 { font-size: 18px; margin: 0 0 4px; } .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .step { background: var(--card); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; box-shadow: 0 1px 2px var(--line); }
  .step .who { font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .step.you { border-left: 5px solid var(--blue); } .step.you .who { color: var(--blue); font-weight: 600; }
  .step.you .t { font-size: 20px; font-weight: 600; }
  .step.saathi .t { color: var(--muted); font-size: 14px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 10px; padding: 6px 12px; cursor: pointer; }
  .err { color: #d64545; }
</style>
</head>
<body>
<h1>Presenter notes</h1>
<div class="sub">Keep this on a second screen or your phone. Read the blue lines aloud when Saathi finishes speaking. The call screen does not show them.</div>
<div id="out">Loading…</div>
<script>
const out = document.getElementById("out");
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const key = () => { try { return sessionStorage.getItem("saath_key") || ""; } catch { return ""; } };
async function load() {
  if (!key()) { const k = window.prompt("Test password (the CHAT_TEST_PASSWORD you set)"); if (k) { try { sessionStorage.setItem("saath_key", k); } catch {} } }
  try {
    const r = await fetch("/api/voice", { method: "POST", headers: { "content-type": "application/json", "x-test-key": key() }, body: JSON.stringify({ action: "script" }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "HTTP " + r.status);
    let n = 0;
    out.innerHTML = j.lines.map((l) => l.who === "Clinic"
      ? `<div class="step you"><div class="who">Your line ${++n}</div><div class="t">${esc(l.text)}</div></div>`
      : `<div class="step saathi"><div class="who">Saathi says</div><div class="t">${esc(l.text)}</div></div>`).join("");
  } catch (e) {
    out.innerHTML = `<p class="err">${esc(e.message)}</p><button onclick="try{sessionStorage.removeItem('saath_key')}catch{};location.reload()">Enter password again</button>`;
  }
}
load();
</script>
</body>
</html>
